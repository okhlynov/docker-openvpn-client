services:
  awg-client:
    image: wireguard-awg:latest
    container_name: amneziawg
    build:
      dockerfile: Dockerfile
      context: docker-amneziawg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      # Mount your local WireGuard configuration file
      - ./local/awg0.conf:/etc/wireguard/awg0.conf
    ports:
      - "3128:3128"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    # Health check configuration
    healthcheck:
      test: ["CMD", "awg", "show"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # The command to run inside the container, specifying the interface name
    command: awg0
    networks:
      - shared-network

  squid:
    image: squid:1.0
    container_name: squid
    network_mode: service:awg-client
    build:
      dockerfile: Dockerfile
      context: squid-build
    restart: unless-stopped

networks:
  shared-network:
    name: shared-network
    
