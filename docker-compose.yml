services:
  awg-client:
    image: wireguard-awg:latest
    container_name: amneziawg
    build:
      dockerfile: Dockerfile
      context: docker-amneziawg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      - USE_COREDNS=false
    volumes:
      - ./local:/config
    ports:
      - "3128:3128"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -4 -sS --max-time 8 http://ifconfig.co >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shared-network


  squid:
    image: squid:1.0
    container_name: squid
    network_mode: service:awg-client
    build:
      dockerfile: Dockerfile
      context: squid-build
    restart: unless-stopped
