services:
  openvpn-client:
    image: openvpn-client-replaced:latest
    container_name: openvpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - ALLOWED_SUBNETS=192.168.10.0/24
      - CONFIG_FILE=client.ovpn
    volumes:
      - ./local:/config
    ports:
      - "3128:3128"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - shared-network

  squid:
    image: squid:latest
    container_name: squid
    network_mode: service:openvpn-client
    restart: unless-stopped

networks:
  shared-network:
    name: shared-network